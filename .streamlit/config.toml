[theme]
base = "light"
primaryColor = "#2F7A72"
backgroundColor = "#F6F3EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#24302E"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#F3F0EA"
textColor = "#24302E"

[server]
fileWatcherType = "poll"
folderWatchBlacklist = ["venv", ".git", "__pycache__", ".pytest_cache"]

[client]
showSidebarNavigation = false