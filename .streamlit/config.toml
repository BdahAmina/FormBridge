[theme]
base = "light"
primaryColor = "#0B6B63"
backgroundColor = "#F4F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B3A"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#F8FAFB"
textColor = "#172B3A"

[server]
fileWatcherType = "poll"
folderWatchBlacklist = ["venv", ".git", "__pycache__", ".pytest_cache"]

[client]
showSidebarNavigation = false